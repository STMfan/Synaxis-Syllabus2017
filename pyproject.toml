[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "synaxis-syllabus2017"
version = "1.0.0.post1"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
description = "Traceable local extraction and retrieval for Chinese 2017 high-school curriculum standards"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4"]

[project.optional-dependencies]
extract = ["pymupdf==1.28.2"]
embedding = ["fastembed==0.9.0"]

[project.scripts]
curriculum-search = "curriculum_search.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/curriculum_search"]

[tool.hatch.build.targets.sdist]
include = ["src/curriculum_search/*.py", "src/curriculum_search/*.json", "tests/*.py", "scripts/*.py", "provenance/*.json", ".github/workflows/*.yml", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "NOTICE", ".gitignore", ".gitattributes"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
